[package]
name = "ason-convert-cli"
version = "1.0.0"
edition = "2024"

license-file = "LICENSE.additional"
description = "Command-line tools for converting between ASON, ASONB, JSON, and JSONC."
homepage = "https://github.com/hemashushu/ason-converter"
repository = "https://github.com/hemashushu/ason-converter"
readme = "../../README.md"
keywords = ["ason", "asonb", "json", "jsonc", "converter"]
categories = ["command-line-utilities", "encoding", "parsing"]

[dependencies]
ason-convert = { path = "../ason-convert" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

[dev-dependencies]
asonb = { path = "/Users/yang/projects/asonb/crates/asonb" }
serde_json = "1.0"