[package]
name = "ason-convert"
version = "0.1.0"
edition = "2024"

license-file = "LICENSE.additional"
description = "A converter between ASON, ASONB, JSON, and JSONC formats."
homepage = "https://github.com/hemashushu/ason-converter"
repository = "https://github.com/hemashushu/ason-converter"
readme = "../../README.md"
keywords = ["ason", "asonb", "json", "jsonc", "converter"]
categories = ["encoding", "parsing"]

[dependencies]
ason = { path = "/Users/yang/projects/ason" }
asonb = { path = "/Users/yang/projects/asonb/crates/asonb" }
base64 = "0.23"
chrono = "0.4"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }