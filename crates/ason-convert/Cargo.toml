[package]
name = "ason-convert"
version = "2.0.1"
edition = "2024"

license-file = "LICENSE.additional"
description = "A Rust library for converting between ASON, ASONB, JSON, and JSONC."
repository = "https://github.com/hemashushu/ason-converter"
readme = "../../README.md"
keywords = ["ason", "asonb", "json", "jsonc", "converter"]
categories = ["encoding", "parsing"]

[dependencies]
ason = "4.1.1"
asonb = "4.1.1"
base64 = "0.23"
chrono = "0.4"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
