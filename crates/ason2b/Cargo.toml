[package]
name = "ason2b"
version = "1.3.0"
edition = "2024"

license-file = "LICENSE.additional"
description = "Command-line tool for converting between ASON and ASONB."
repository = "https://github.com/hemashushu/ason-converter"
readme = "../../README.md"
keywords = ["ason", "asonb", "converter", "cli"]
categories = ["command-line-utilities", "encoding", "parsing"]

[dependencies]
ason-convert = { path = "../ason-convert", version = "1.3.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

