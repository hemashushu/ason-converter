[package]
name = "ason2j"
version = "2.0.0"
edition = "2024"

license-file = "LICENSE.additional"
description = "Command-line tool for converting between ASON/ASONB and JSON/JSONC."
repository = "https://github.com/hemashushu/ason-converter"
readme = "../../README.md"
keywords = ["ason", "asonb", "json", "jsonc", "converter"]
categories = ["command-line-utilities", "encoding", "parsing"]

[dependencies]
ason-convert = { path = "../ason-convert", version = "2.0.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

[dev-dependencies]
asonb = "4.1.0"
serde_json = "1.0"
